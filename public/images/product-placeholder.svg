<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern gradient background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7f7f2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e4e6c3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f05d23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c5d86d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="60" fill="#c5d86d" opacity="0.1"/>
  <circle cx="700" cy="700" r="80" fill="#f05d23" opacity="0.1"/>
  <circle cx="700" cy="100" r="50" fill="#c5d86d" opacity="0.1"/>
  
  <!-- Modern product box icon -->
  <g transform="translate(400, 320)">
    <!-- Box shadow -->
    <path d="M -100 120 L -80 130 L 120 30 L 100 20 Z" fill="#261c15" opacity="0.1"/>
    
    <!-- Main box -->
    <path d="M -120 -20 L 0 -80 L 120 -20 L 120 80 L 0 140 L -120 80 Z" 
          fill="url(#iconGradient)" opacity="0.9"/>
    
    <!-- Box top face -->
    <path d="M -120 -20 L 0 -80 L 120 -20 L 0 40 Z" 
          fill="#f05d23" opacity="0.8"/>
    
    <!-- Box right face -->
    <path d="M 120 -20 L 120 80 L 0 140 L 0 40 Z" 
          fill="#c5d86d" opacity="0.6"/>
    
    <!-- Box left face -->
    <path d="M -120 -20 L -120 80 L 0 140 L 0 40 Z" 
          fill="#e4e6c3" opacity="0.7"/>
    
    <!-- Highlight lines -->
    <line x1="0" y1="-80" x2="0" y2="40" stroke="white" stroke-width="3" opacity="0.3"/>
    <line x1="-120" y1="-20" x2="0" y2="40" stroke="white" stroke-width="2" opacity="0.2"/>
    <line x1="120" y1="-20" x2="0" y2="40" stroke="white" stroke-width="2" opacity="0.2"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="550" font-family="system-ui, -apple-system, sans-serif" 
        font-size="32" font-weight="600" fill="#261c15" text-anchor="middle" opacity="0.6">
    Product Image
  </text>
  <text x="400" y="590" font-family="system-ui, -apple-system, sans-serif" 
        font-size="20" font-weight="400" fill="#261c15" text-anchor="middle" opacity="0.4">
    Not Available
  </text>
</svg>